{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center reveal">
    <div class="col-lg-8">
        <div class="card shadow-sm glass-card form-panel">
            <div class="card-body p-4">
                <h2 class="h3 mb-3 section-title">{% if transaction %}Edit{% else %}Add{% endif %} Transaction</h2>
                <form method="post" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Type</label>
                        <select name="type" class="form-select" required>
                            {% set selected_type = transaction.type if transaction else request.form.get('type', '') %}
                            <option value="">Choose...</option>
                            <option value="income" {% if selected_type == 'income' %}selected{% endif %}>Income</option>
                            <option value="expense" {% if selected_type == 'expense' %}selected{% endif %}>Expense</option>
                            <option value="transfer" {% if selected_type == 'transfer' %}selected{% endif %}>Transfer</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Amount</label>
                        <input type="number" step="0.01" min="0.01" name="amount" class="form-control" required
                            value="{{ transaction.amount if transaction else request.form.get('amount', '') }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Date</label>
                        <input type="date" name="transaction_date" class="form-control" required
                            value="{{ transaction.transaction_date.strftime('%Y-%m-%d') if transaction else request.form.get('transaction_date', '') }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Category</label>
                        <input type="text" name="category" class="form-control"
                            value="{{ transaction.category if transaction else request.form.get('category', '') }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Description</label>
                        <input type="text" name="description" class="form-control"
                            value="{{ transaction.description if transaction else request.form.get('description', '') }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">From Account (for transfer)</label>
                        <input type="text" name="from_account" class="form-control"
                            value="{{ transaction.from_account if transaction else request.form.get('from_account', '') }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">To Account (for transfer)</label>
                        <input type="text" name="to_account" class="form-control"
                            value="{{ transaction.to_account if transaction else request.form.get('to_account', '') }}">
                    </div>
                    <div class="col-12 d-flex gap-2">
                        <button class="btn btn-primary" type="submit">Save transaction</button>
                        <a class="btn btn-outline-secondary" href="{{ url_for('transactions') }}">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
